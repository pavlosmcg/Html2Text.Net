name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional package version override (leave blank to use csproj/Directory.Build.props)"
        required: false
        type: string
      dry_run:
        description: "Build + pack only (don't push)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build ./Html2Text/Html2Text.csproj -c Release --no-restore

      - name: Pack
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            dotnet pack ./Html2Text/Html2Text.csproj -c Release --no-build -p:PackageVersion=${{ inputs.version }} -o ./package
          else
            dotnet pack ./Html2Text/Html2Text.csproj -c Release --no-build -o ./package
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ./package/*.nupkg

      - name: NuGet login (1hr temp token)
        uses: NuGet/login@v1
        id: login
        with:
          user: pavlosmcg

      - name: Push to NuGet
        if: ${{ inputs.dry_run == false }}
        run: |
          dotnet nuget push "./package/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
